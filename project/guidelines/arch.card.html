<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--off-white);margin:0}.arch{width:140px;height:170px;border-top-left-radius:9999px;border-top-right-radius:9999px;position:relative}</style></head><body><div style="display:flex;gap:20px;align-items:flex-end"><div class="arch" style="background:var(--bege);display:flex;align-items:center;justify-content:center"><span style="font-family:var(--font-script);font-size:30px;color:var(--terracota);line-height:1">portal</span></div><div class="arch" style="background:var(--petroleo);display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px"><span style="font-family:var(--font-display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--off-white);font-size:22px">ARKO</span></div><div class="arch" style="background:transparent;border:2px solid var(--petroleo);display:flex;align-items:center;justify-content:center"><span style="font-family:var(--font-display);font-weight:900;font-size:80px;color:var(--petroleo);line-height:1">A</span></div><div style="flex:1;font-family:var(--font-body);font-style:italic;font-size:12px;color:var(--grafite-mute);line-height:1.55">Aparece em uma peça a cada campanha. Nunca em botão, ícone ou pastilha. Preencha com bege, petróleo ou contorno — nunca com terracota (cansa o olho).</div></div></body></html>
