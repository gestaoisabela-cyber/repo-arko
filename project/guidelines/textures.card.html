<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--off-white);margin:0}.tex{flex:1;border-radius:var(--radius-lg);padding:18px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow-inset-warm);position:relative;overflow:hidden}.paper{background:var(--off-white);background-image:radial-gradient(rgba(46,46,44,.05) 1px,transparent 1.4px),radial-gradient(rgba(158,80,52,.045) 1px,transparent 1.4px);background-size:14px 14px,26px 26px;background-position:0 0,7px 13px;color:var(--petroleo)}.plaster{background:var(--bege);background-image:radial-gradient(rgba(31,58,68,.10) 1.4px,transparent 2px),radial-gradient(rgba(46,46,44,.06) 1.2px,transparent 1.6px);background-size:22px 22px,9px 9px;background-position:0 0,4px 6px;color:var(--petroleo)}</style></head><body><div style="display:flex;gap:14px"><div class="tex paper"><div style="font-family:var(--font-display);font-weight:700;font-size:20px">Papel artesanal</div><div style="font-family:var(--font-body);font-style:italic;font-size:11px;color:var(--grafite-mute)">seções off-white — fibra suave, quase invisível</div></div><div class="tex plaster"><div style="font-family:var(--font-display);font-weight:700;font-size:20px">Reboco</div><div style="font-family:var(--font-body);font-style:italic;font-size:11px;color:var(--grafite-soft)">seções bege — grão fechado, temperatura de parede</div></div></div></body></html>
