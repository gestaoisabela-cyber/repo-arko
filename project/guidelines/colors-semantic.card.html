<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--off-white);margin:0}</style></head><body><div style="display:flex;gap:10px"><div style="flex:1;background:var(--status-success-bg);color:var(--status-success-fg);border-radius:var(--radius-md);padding:14px"><div style="font-family:var(--font-display);font-weight:700;font-size:14px">Concluído</div><div style="font-family:var(--font-body);font-size:11px;opacity:.75;margin-top:4px;font-style:italic">success</div></div><div style="flex:1;background:var(--status-warning-bg);color:var(--status-warning-fg);border-radius:var(--radius-md);padding:14px"><div style="font-family:var(--font-display);font-weight:700;font-size:14px">Atenção</div><div style="font-family:var(--font-body);font-size:11px;opacity:.75;margin-top:4px;font-style:italic">warning</div></div><div style="flex:1;background:var(--status-danger-bg);color:var(--status-danger-fg);border-radius:var(--radius-md);padding:14px"><div style="font-family:var(--font-display);font-weight:700;font-size:14px">Erro</div><div style="font-family:var(--font-body);font-size:11px;opacity:.75;margin-top:4px;font-style:italic">danger</div></div><div style="flex:1;background:var(--status-info-bg);color:var(--status-info-fg);border-radius:var(--radius-md);padding:14px"><div style="font-family:var(--font-display);font-weight:700;font-size:14px">Info</div><div style="font-family:var(--font-body);font-size:11px;opacity:.75;margin-top:4px;font-style:italic">info</div></div></div></body></html>
